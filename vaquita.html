<title>Vaquita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper:#F1F3EA;
    --surface:#FCFCF7;
    --surface-2:#F5F7EF;
    --ink:#1C2420;
    --ink-soft:#5B6459;
    --border:#DAE2D2;
    --brand:#2E6B45;
    --brand-strong:#1F5535;
    --brand-soft:#DEEBDD;
    --owes:#B14F2B;
    --owes-soft:#F5E4DA;
    --owed:#245E82;
    --owed-soft:#DEEAF0;
    --settled:#7A8577;
    --settled-soft:#E7EAE2;
    --shadow: 0 1px 2px rgba(28,36,32,0.06), 0 6px 20px -12px rgba(28,36,32,0.18);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160F;
      --surface:#1A2018;
      --surface-2:#20271D;
      --ink:#E9EDE4;
      --ink-soft:#A7B2A2;
      --border:#2B332B;
      --brand:#6CBB86;
      --brand-strong:#8ED0A3;
      --brand-soft:#1F3126;
      --owes:#E28A63;
      --owes-soft:#3A2620;
      --owed:#6FB8DA;
      --owed-soft:#1E2E37;
      --settled:#8C9A8A;
      --settled-soft:#232A22;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160F;
    --surface:#1A2018;
    --surface-2:#20271D;
    --ink:#E9EDE4;
    --ink-soft:#A7B2A2;
    --border:#2B332B;
    --brand:#6CBB86;
    --brand-strong:#8ED0A3;
    --brand-soft:#1F3126;
    --owes:#E28A63;
    --owes-soft:#3A2620;
    --owed:#6FB8DA;
    --owed-soft:#1E2E37;
    --settled:#8C9A8A;
    --settled-soft:#232A22;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    color:var(--ink);
  }
  .mono, .amount{
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;}
  input, select{font-family:inherit; color:inherit;}
  a{color:inherit;}

  ::selection{background:var(--brand-soft); color:var(--brand-strong);}

  .wrap{max-width:960px; margin:0 auto; padding:28px 20px 80px;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    margin-bottom:28px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{font-size:1.5rem;}
  .brand h1{font-size:1.7rem; margin:0;}
  .tagline{color:var(--ink-soft); font-size:0.92rem; margin:2px 0 0;}
  .sync-chip{
    display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-size:0.8rem; cursor:pointer; white-space:nowrap;
  }
  .sync-chip:hover{border-color:var(--brand); color:var(--ink);}

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); padding:9px 16px; border-radius:10px; font-size:0.92rem;
    font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:transform .08s ease, border-color .15s ease;
  }
  .btn:hover{border-color:var(--brand);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.primary:hover{background:var(--brand-strong); border-color:var(--brand-strong);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:6px 8px;}
  .btn.ghost:hover{color:var(--owes); border-color:transparent;}
  .btn.small{padding:6px 11px; font-size:0.82rem; border-radius:8px;}
  .btn.danger{color:var(--owes);}
  .btn[disabled]{opacity:0.45; cursor:not-allowed;}

  .section-title{
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-soft); font-weight:600; margin:0 0 12px;
  }

  .grid-cards{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:10px; width:100%;
  }
  .card:hover{border-color:var(--brand);}
  .card:focus-visible{outline:2px solid var(--brand); outline-offset:2px;}
  .card h3{font-size:1.15rem; margin:0;}
  .card .meta{color:var(--ink-soft); font-size:0.85rem;}
  .card .total{font-size:1.3rem; font-weight:600;}
  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px;
    font-size:0.76rem; font-weight:600; width:fit-content;
  }
  .pill.pending{background:var(--owes-soft); color:var(--owes);}
  .pill.clear{background:var(--brand-soft); color:var(--brand-strong);}
  .pill.settled{background:var(--settled-soft); color:var(--settled);}

  .empty{
    border:1.5px dashed var(--border); border-radius:var(--radius); padding:36px 20px;
    text-align:center; color:var(--ink-soft);
  }

  .new-group-row{display:flex; gap:8px; margin-bottom:24px;}
  .new-group-row input{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); font-size:0.95rem;
  }
  .new-group-row input:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--brand); outline-offset:1px;
  }

  details.archive{margin-top:36px;}
  details.archive summary{cursor:pointer; font-weight:600; color:var(--ink-soft); font-size:0.88rem; list-style:none; display:flex; align-items:center; gap:6px;}
  details.archive summary::-webkit-details-marker{display:none;}
  details.archive summary:before{content:"▸"; transition:transform .15s;}
  details.archive[open] summary:before{transform:rotate(90deg);}
  details.archive .grid-cards{margin-top:14px;}
  .card.archived{opacity:0.72;}

  /* group detail */
  .back{margin-bottom:18px;}
  .group-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .group-title-edit{
    font-family:"Fraunces",serif; font-size:1.7rem; font-weight:600; border:none; background:transparent;
    color:var(--ink); border-bottom:2px solid transparent; padding:0 2px;
  }
  .group-title-edit:focus-visible{outline:none; border-bottom-color:var(--brand);}
  .group-actions{display:flex; gap:6px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .chip{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border);
    padding:6px 8px 6px 13px; border-radius:999px; font-size:0.88rem;
  }
  .chip button{background:none; border:none; color:var(--ink-soft); cursor:pointer; padding:2px 4px; border-radius:999px; line-height:1;}
  .chip button:hover{color:var(--owes); background:var(--owes-soft);}
  .add-chip-form{display:inline-flex; gap:6px; align-items:center;}
  .add-chip-form input{
    padding:6px 10px; border-radius:999px; border:1px dashed var(--border); background:transparent; font-size:0.86rem; width:130px;
  }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; margin-bottom:22px;
  }
  .panel h2{font-size:1.1rem; margin:0 0 14px;}

  table.ledger{width:100%; border-collapse:collapse; font-size:0.92rem;}
  table.ledger th{
    text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--border);
  }
  table.ledger td{padding:11px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger td.amount{text-align:right; font-weight:600;}
  .desc{font-weight:500;}
  .split-note{color:var(--ink-soft); font-size:0.8rem; display:block; margin-top:2px;}
  .row-actions{display:flex; gap:2px; justify-content:flex-end;}

  .expense-form{display:flex; flex-direction:column; gap:14px;}
  .form-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:5px; flex:1; min-width:140px;}
  .field label{font-size:0.78rem; color:var(--ink-soft); font-weight:600;}
  .field input, .field select{
    padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); font-size:0.94rem;
  }
  .split-mode{display:flex; gap:6px; flex-wrap:wrap;}
  .mode-btn{
    padding:7px 13px; border-radius:999px; border:1px solid var(--border); background:transparent;
    font-size:0.84rem; cursor:pointer; color:var(--ink-soft); font-weight:600;
  }
  .mode-btn.active{background:var(--brand-soft); border-color:var(--brand); color:var(--brand-strong);}
  .split-picker{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px;
  }
  .split-picker label{display:flex; align-items:center; gap:8px; font-size:0.88rem;}
  .split-picker .value-input{
    width:80px; padding:4px 7px; border-radius:6px; border:1px solid var(--border); font-size:0.85rem; margin-left:auto;
  }
  .split-sum-note{font-size:0.8rem; color:var(--ink-soft);}
  .split-sum-note.bad{color:var(--owes);}
  .split-sum-note.good{color:var(--brand);}

  /* receipt */
  .receipt{
    position:relative; background:var(--surface); border:1px solid var(--border);
    border-radius:2px; padding:26px 24px 20px; box-shadow:var(--shadow);
    clip-path: polygon(
      0% 10px, 3% 0, 6% 10px, 9% 0, 12% 10px, 15% 0, 18% 10px, 21% 0, 24% 10px, 27% 0,
      30% 10px, 33% 0, 36% 10px, 39% 0, 42% 10px, 45% 0, 48% 10px, 51% 0, 54% 10px, 57% 0,
      60% 10px, 63% 0, 66% 10px, 69% 0, 72% 10px, 75% 0, 78% 10px, 81% 0, 84% 10px, 87% 0,
      90% 10px, 93% 0, 96% 10px, 99% 0, 100% 10px,
      100% 100%, 0% 100%
    );
  }
  .receipt-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
  .receipt-head h2{margin:0; font-size:1.05rem;}
  .receipt-sub{color:var(--ink-soft); font-size:0.8rem; margin:0 0 16px;}
  .transfer-line{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px dashed var(--border);
  }
  .transfer-line:last-of-type{border-bottom:none;}
  .transfer-text{flex:1; font-size:0.98rem;}
  .transfer-text b{font-weight:700;}
  .transfer-text .amt{font-weight:700;}
  .transfer-text .arrow{color:var(--ink-soft); margin:0 4px;}
  .paid-toggle{
    display:flex; align-items:center; gap:7px; font-size:0.8rem; color:var(--ink-soft); cursor:pointer; user-select:none;
    padding:5px 10px; border-radius:999px; border:1px solid var(--border);
  }
  .paid-toggle input{accent-color:var(--brand); width:15px; height:15px;}
  .paid-toggle.is-paid{background:var(--brand-soft); color:var(--brand-strong); border-color:var(--brand-soft); text-decoration:line-through;}
  .all-clear{text-align:center; padding:20px 0; color:var(--brand); font-weight:600; font-family:"Fraunces",serif; font-size:1.15rem;}

  .detail-toggle{margin-top:14px;}
  .detail-toggle summary{cursor:pointer; font-size:0.84rem; font-weight:600; color:var(--ink-soft); list-style:none;}
  .detail-toggle summary::-webkit-details-marker{display:none;}
  .detail-toggle summary:before{content:"▸ "; }
  .detail-toggle[open] summary:before{content:"▾ ";}
  .balance-table{width:100%; margin-top:12px; border-collapse:collapse; font-size:0.86rem;}
  .balance-table th{text-align:left; color:var(--ink-soft); font-weight:600; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; padding:0 8px 6px;}
  .balance-table th:not(:first-child){text-align:right;}
  .balance-table td{padding:8px; border-top:1px solid var(--border);}
  .balance-table td.amount{text-align:right;}
  .balance-table td.pos{color:var(--owed);}
  .balance-table td.neg{color:var(--owes);}

  .copy-row{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  textarea.share-text{
    width:100%; min-height:110px; border:1px solid var(--border); border-radius:10px; padding:12px;
    font-family:"IBM Plex Mono", monospace; font-size:0.82rem; background:var(--surface-2); color:var(--ink);
    resize:vertical;
  }

  footer.foot{margin-top:60px; text-align:center; color:var(--ink-soft); font-size:0.78rem;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,18,14,0.5); display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .modal-box{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; max-width:460px; width:100%; box-shadow:var(--shadow);
  }
  .modal-box.wide{max-width:640px;}
  .modal-box h3{margin:0 0 6px;}
  .modal-message{margin:0 0 18px; font-size:0.96rem; line-height:1.5; color:var(--ink);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
  .btn.danger-solid{background:var(--owes); border-color:var(--owes); color:#fff;}
  .btn.danger-solid:hover{filter:brightness(0.92);}
  .receipt-image-frame{max-height:60vh; overflow:auto; border:1px solid var(--border); border-radius:10px; background:var(--surface-2);}
  .receipt-image-frame img{display:block; width:100%; height:auto;}

  @media (max-width:600px){
    .wrap{padding:20px 14px 60px;}
    table.ledger{font-size:0.85rem;}
    table.ledger th:nth-child(1), table.ledger td:nth-child(1){display:none;}
  }
</style>

<div class="wrap" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBl3ySQvwKhNgsyExnCWKsyvtITq4eDApY",
  authDomain: "vaquita-a337d.firebaseapp.com",
  projectId: "vaquita-a337d",
  storageBucket: "vaquita-a337d.firebasestorage.app",
  messagingSenderId: "831550739621",
  appId: "1:831550739621:web:040d730454c9a4d1e2e94c"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
try{ enableIndexedDbPersistence(db); }catch(e){ /* fine if it fails (e.g. multiple tabs) */ }

(function(){
  "use strict";

  /* ---------- storage layer: Firestore, keyed by a random "código de sincronización" kept in localStorage ---------- */
  const CODE_KEY = "vaquita-sync-code";

  function genCode(){
    if(window.crypto && typeof crypto.randomUUID === "function"){
      return crypto.randomUUID().replace(/-/g, "").toUpperCase();
    }
    const bytes = new Uint8Array(16);
    if(window.crypto && typeof crypto.getRandomValues === "function"){
      crypto.getRandomValues(bytes);
    } else {
      for(let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  }
  function formatCode(code){
    return (code || "").match(/.{1,4}/g)?.join("-") || "";
  }
  function getSyncCode(){
    let code = localStorage.getItem(CODE_KEY);
    if(!code){
      code = genCode();
      localStorage.setItem(CODE_KEY, code);
    }
    return code;
  }
  function setSyncCode(code){
    localStorage.setItem(CODE_KEY, code);
  }

  let syncCode = getSyncCode();
  let lastSyncedJson = null;
  let unsubscribeSnapshot = null;

  const Store = {
    async load(code){
      try{
        const snap = await getDoc(doc(db, "vaquitas", code));
        if(snap.exists()){
          const data = snap.data();
          return (data && Array.isArray(data.groups)) ? data : { groups: [] };
        }
        return { groups: [] };
      }catch(e){
        console.error("Vaquita: no se pudo cargar desde Firestore", e);
        return { groups: [] };
      }
    },
    save(code, data){
      const json = JSON.stringify(data);
      lastSyncedJson = json;
      setDoc(doc(db, "vaquitas", code), data).catch(e => {
        console.error("Vaquita: no se pudo guardar en Firestore", e);
      });
    }
  };

  function switchSyncCode(newCode){
    newCode = (newCode || "").replace(/[^A-Z0-9]/gi, "").toUpperCase();
    if(!newCode || newCode === syncCode) return;
    setSyncCode(newCode);
    syncCode = newCode;
    lastSyncedJson = null;
    view = { screen: "dashboard", groupId: null };
    init();
  }

  function subscribeSync(code){
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = onSnapshot(doc(db, "vaquitas", code), snap => {
      if(!snap.exists()) return;
      const data = snap.data();
      if(!data || !Array.isArray(data.groups)) return;
      const json = JSON.stringify(data);
      if(json === lastSyncedJson) return;
      lastSyncedJson = json;
      state = data;
      render();
    }, err => console.error("Vaquita: error de sincronización", err));
  }

  let state = { groups: [] };
  let view = { screen: "dashboard", groupId: null };

  function persist(){
    render();
    Store.save(syncCode, state);
  }
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function fmt(n){
    n = Math.round(n||0);
    return (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("es-CL");
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function findGroup(id){ return state.groups.find(g => g.id === id); }

  /* ---------- settlement math ---------- */
  function expenseSubset(exp, group){
    if(exp.splitMode === "equal" && !exp.fixedParticipants){
      return group.participants.slice();
    }
    return exp.fixedParticipants ? exp.fixedParticipants.slice() : group.participants.slice();
  }

  function computeShares(exp, group){
    const subset = expenseSubset(exp, group);
    const shares = {};
    if(subset.length === 0) return shares;

    if(exp.splitMode === "percent"){
      let assigned = 0;
      subset.forEach((p,i) => {
        const pct = (exp.percents && exp.percents[p]) || 0;
        let share = Math.round(exp.amount * pct / 100);
        shares[p] = share;
        assigned += share;
      });
      const diff = exp.amount - assigned;
      if(diff !== 0 && subset.length){ shares[subset[0]] += diff; }
    } else if(exp.splitMode === "amount"){
      subset.forEach(p => { shares[p] = (exp.amounts && exp.amounts[p]) || 0; });
    } else {
      const base = Math.floor(exp.amount / subset.length);
      let remainder = exp.amount - base * subset.length;
      subset.forEach((p,i) => {
        shares[p] = base + (i < remainder ? 1 : 0);
      });
    }
    return shares;
  }

  function computeSettlement(group){
    const balance = {};
    group.participants.forEach(p => balance[p] = 0);

    group.expenses.forEach(exp => {
      if(balance[exp.payer] === undefined) balance[exp.payer] = 0;
      balance[exp.payer] += exp.amount;
      const shares = computeShares(exp, group);
      Object.keys(shares).forEach(p => {
        if(balance[p] === undefined) balance[p] = 0;
        balance[p] -= shares[p];
      });
    });

    const debtors = [];
    const creditors = [];
    Object.keys(balance).forEach(p => {
      const v = balance[p];
      if(v < -0.5) debtors.push({ name:p, amt:-v });
      else if(v > 0.5) creditors.push({ name:p, amt:v });
    });
    debtors.sort((a,b) => b.amt - a.amt);
    creditors.sort((a,b) => b.amt - a.amt);

    const transfers = [];
    let i=0, j=0;
    while(i < debtors.length && j < creditors.length){
      const amt = Math.min(debtors[i].amt, creditors[j].amt);
      if(amt > 0.5){
        transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(amt) });
      }
      debtors[i].amt -= amt;
      creditors[j].amt -= amt;
      if(debtors[i].amt <= 0.5) i++;
      if(creditors[j].amt <= 0.5) j++;
    }

    const prevPaid = group.paidTransfers || {};
    transfers.forEach(t => {
      const key = t.from + "→" + t.to;
      t.key = key;
      t.paid = !!prevPaid[key];
    });

    return { balance, transfers };
  }

  function transferTotals(group){
    const total = group.expenses.reduce((s,e) => s + (e.amount||0), 0);
    const paidByCount = {};
    group.expenses.forEach(e => paidByCount[e.payer] = (paidByCount[e.payer]||0) + e.amount);
    return { total, paidByCount };
  }

  function syncArchiveState(group){
    const { transfers } = computeSettlement(group);
    if(group.status === "active" && transfers.length > 0 && transfers.every(t => t.paid)){
      group.status = "archived";
      group.archivedAt = Date.now();
    }
  }

  /* ---------- actions ---------- */
  const Actions = {
    createGroup(name){
      name = name.trim();
      if(!name) return;
      const g = { id: uid(), name, status:"active", createdAt: Date.now(), participants: [], expenses: [], paidTransfers: {} };
      state.groups.unshift(g);
      view = { screen:"group", groupId: g.id };
      persist();
    },
    deleteGroup(id){
      showConfirm("¿Eliminar este grupo completo? Esta acción no se puede deshacer.", () => {
        state.groups = state.groups.filter(g => g.id !== id);
        view = { screen:"dashboard", groupId:null };
        persist();
      });
    },
    unarchiveGroup(id){
      const g = findGroup(id); if(!g) return;
      g.status = "active";
      persist();
    },
    renameGroup(id, name){
      const g = findGroup(id); if(!g) return;
      name = name.trim();
      if(name) g.name = name;
      persist();
    },
    addParticipant(id, name){
      const g = findGroup(id); if(!g) return;
      name = name.trim();
      if(!name) return;
      if(g.participants.some(p => p.toLowerCase() === name.toLowerCase())){
        showAlert("Ese nombre ya está en el grupo."); return;
      }
      g.participants.push(name);
      persist();
    },
    removeParticipant(id, name){
      const g = findGroup(id); if(!g) return;
      if(g.expenses.some(e => e.payer === name)){
        showAlert(name + " pagó al menos un gasto, así que no se puede quitar. Edita o elimina ese gasto primero.");
        return;
      }
      g.participants = g.participants.filter(p => p !== name);
      g.expenses.forEach(e => {
        if(e.fixedParticipants) e.fixedParticipants = e.fixedParticipants.filter(p => p !== name);
        if(e.percents) delete e.percents[name];
        if(e.amounts) delete e.amounts[name];
      });
      persist();
    },
    addExpense(groupId, exp){
      const g = findGroup(groupId); if(!g) return;
      exp.id = uid();
      g.expenses.push(exp);
      syncArchiveState(g);
      persist();
    },
    updateExpense(groupId, expId, patch){
      const g = findGroup(groupId); if(!g) return;
      const exp = g.expenses.find(e => e.id === expId); if(!exp) return;
      Object.assign(exp, patch);
      syncArchiveState(g);
      persist();
    },
    deleteExpense(groupId, expId){
      showConfirm("¿Eliminar este gasto?", () => {
        const g = findGroup(groupId); if(!g) return;
        g.expenses = g.expenses.filter(e => e.id !== expId);
        syncArchiveState(g);
        persist();
      });
    },
    toggleTransferPaid(groupId, key, val){
      const g = findGroup(groupId); if(!g) return;
      g.paidTransfers = g.paidTransfers || {};
      g.paidTransfers[key] = val;
      syncArchiveState(g);
      persist();
    }
  };
  window.__vaquitaActions = Actions;

  /* ---------- rendering ---------- */
  function render(){
    const root = document.getElementById("app");
    root.innerHTML = view.screen === "group" && findGroup(view.groupId)
      ? renderGroupScreen(findGroup(view.groupId))
      : renderDashboard();
    wireEvents(root);
  }

  function renderHeader(){
    return `
      <header class="top">
        <div class="brand">
          <span class="mark">🐮</span>
          <div>
            <h1>Vaquita</h1>
            <p class="tagline">Junten la plata, sepan quién debe qué.</p>
          </div>
        </div>
        <button class="sync-chip" data-action="show-sync" title="Sincronización entre dispositivos">
          🔗 <span class="mono">${esc(formatCode(syncCode).slice(0, 9))}…</span>
        </button>
      </header>`;
  }

  function openSyncModal(){
    const ov = openModal(`
      <h3>Sincronización</h3>
      <p class="modal-message">Este código conecta tus datos entre dispositivos. Ingresa el mismo código en tu otro celular o PC para ver aquí la misma información.</p>
      <div class="field">
        <label>Tu código actual</label>
        <div style="display:flex; gap:8px;">
          <input type="text" readonly value="${esc(formatCode(syncCode))}" id="sync-code-display" class="mono" style="flex:1;">
          <button class="btn small" id="sync-copy">Copiar</button>
        </div>
      </div>
      <div class="field" style="margin-top:16px;">
        <label>Usar otro código (para vincular otro dispositivo, o unirte a uno compartido)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" placeholder="Pega un código aquí" id="sync-code-input">
          <button class="btn small primary" id="sync-switch">Usar</button>
        </div>
      </div>
      <div class="modal-actions" style="margin-top:16px;"><button class="btn ghost" id="sync-close">Cerrar</button></div>
    `, { wide: false });
    ov.querySelector("#sync-close").addEventListener("click", closeModal);
    ov.querySelector("#sync-copy").addEventListener("click", () => {
      const input = ov.querySelector("#sync-code-display");
      input.select();
      try{ document.execCommand("copy"); }catch(e){}
      const btn = ov.querySelector("#sync-copy");
      const orig = btn.textContent;
      btn.textContent = "¡Copiado!";
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
    ov.querySelector("#sync-switch").addEventListener("click", () => {
      const val = ov.querySelector("#sync-code-input").value;
      if(!val.trim()) return;
      closeModal();
      switchSyncCode(val);
    });
  }

  function groupCard(g){
    const { transfers } = computeSettlement(g);
    const { total } = transferTotals(g);
    const pending = transfers.filter(t => !t.paid).length;
    let pill;
    if(g.status === "archived"){
      pill = `<span class="pill settled">✓ archivada</span>`;
    } else if(transfers.length === 0){
      pill = `<span class="pill clear">Sin gastos aún</span>`;
    } else if(pending === 0){
      pill = `<span class="pill clear">Todo cuadrado</span>`;
    } else {
      pill = `<span class="pill pending">${pending} transferencia${pending===1?"":"s"} pendiente${pending===1?"":"s"}</span>`;
    }
    return `
      <button class="card ${g.status==='archived'?'archived':''}" data-action="open-group" data-id="${g.id}">
        <h3>${esc(g.name)}</h3>
        <span class="meta">${g.participants.length} persona${g.participants.length===1?"":"s"} · ${g.expenses.length} gasto${g.expenses.length===1?"":"s"}</span>
        <span class="total mono">${fmt(total)}</span>
        ${pill}
      </button>`;
  }

  function renderDashboard(){
    const active = state.groups.filter(g => g.status !== "archived");
    const archived = state.groups.filter(g => g.status === "archived");
    return `
      ${renderHeader()}
      <div class="new-group-row">
        <input type="text" id="new-group-name" placeholder="Nombre del grupo, ej. Cumpleaños Mamá" maxlength="60">
        <button class="btn primary" data-action="create-group">+ Nueva vaquita</button>
      </div>
      <p class="section-title">Grupos activos</p>
      ${active.length ? `<div class="grid-cards">${active.map(groupCard).join("")}</div>`
        : `<div class="empty">Todavía no tienes ninguna vaquita activa.<br>Crea una arriba para empezar a repartir gastos.</div>`}
      ${archived.length ? `
        <details class="archive">
          <summary>Archivadas (${archived.length})</summary>
          <div class="grid-cards">${archived.map(groupCard).join("")}</div>
        </details>` : ""}
      <footer class="foot">Vaquita · tus datos se sincronizan con tu código (icono 🔗 arriba).</footer>
    `;
  }

  function ledgerRow(g, exp){
    const subset = expenseSubset(exp, g);
    let note = "";
    if(exp.splitMode === "percent") note = "Por porcentaje entre " + subset.length + " persona" + (subset.length===1?"":"s");
    else if(exp.splitMode === "amount") note = "Montos fijos entre " + subset.length + " persona" + (subset.length===1?"":"s");
    else if(exp.fixedParticipants) note = "Partes iguales entre " + subset.length + " persona" + (subset.length===1?"":"s");
    else note = "Partes iguales entre todos";
    return `
      <tr>
        <td>${esc(exp.payer)}</td>
        <td><span class="desc">${esc(exp.description)}</span><span class="split-note">${note}</span></td>
        <td class="amount mono">${fmt(exp.amount)}</td>
        <td class="row-actions">
          <button class="btn ghost small" data-action="edit-expense" data-id="${exp.id}" title="Editar">✎</button>
          <button class="btn ghost small" data-action="delete-expense" data-id="${exp.id}" title="Eliminar">✕</button>
        </td>
      </tr>`;
  }

  function renderSettlement(g){
    const { balance, transfers } = computeSettlement(g);
    const anyExpense = g.expenses.length > 0;
    let body;
    if(!anyExpense){
      body = `<p class="receipt-sub">Agrega gastos para ver el cuadre.</p>`;
    } else if(transfers.length === 0){
      body = `<div class="all-clear">✓ Las cuentas ya están parejas.</div>`;
    } else {
      body = transfers.map(t => `
        <div class="transfer-line">
          <div class="transfer-text">
            <b>${esc(t.from)}</b><span class="arrow">→</span><b>${esc(t.to)}</b>
            &nbsp;<span class="amt mono">${fmt(t.amount)}</span>
          </div>
          <label class="paid-toggle ${t.paid ? 'is-paid':''}">
            <input type="checkbox" data-action="toggle-paid" data-key="${esc(t.key)}" ${t.paid?'checked':''}>
            ${t.paid ? 'Pagada' : 'Marcar pagada'}
          </label>
        </div>
      `).join("");
    }

    const shareLines = transfers.map(t => `${t.from} le debe ${fmt(t.amount)} a ${t.to}`).join("\n");

    const detail = anyExpense ? `
      <details class="detail-toggle">
        <summary>Ver detalle de pagos y cuotas</summary>
        <table class="balance-table">
          <thead><tr><th>Persona</th><th>Pagó en total</th><th>Le correspondía</th><th>Balance</th></tr></thead>
          <tbody>
            ${g.participants.map(p => {
              const paidTotal = g.expenses.filter(e => e.payer===p).reduce((s,e)=>s+e.amount,0);
              const bal = balance[p] || 0;
              const owed = paidTotal - bal;
              return `<tr>
                <td>${esc(p)}</td>
                <td class="amount mono">${fmt(paidTotal)}</td>
                <td class="amount mono">${fmt(owed)}</td>
                <td class="amount mono ${bal>0.5?'pos':bal<-0.5?'neg':''}">${bal>0.5?'+':''}${fmt(bal)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </details>` : "";

    return `
      <div class="receipt">
        <div class="receipt-head"><h2>Cuadre final</h2></div>
        <p class="receipt-sub">Transferencias mínimas necesarias para dejar las cuentas en cero.</p>
        ${body}
        ${detail}
        ${anyExpense ? `
          <div class="copy-row">
            ${transfers.length ? `<button class="btn small" data-action="copy-share">Copiar texto</button>` : ""}
            <button class="btn small primary" data-action="share-image">Generar imagen para compartir</button>
          </div>
          ${transfers.length ? `<textarea class="share-text" id="share-text" readonly hidden>${esc(shareLines)}</textarea>` : ""}
        ` : ""}
      </div>
    `;
  }

  function splitEditorHtml(g, exp){
    const mode = exp ? exp.splitMode : "equal";
    const custom = exp ? !!exp.fixedParticipants || mode!=="equal" : false;
    const chosen = exp ? expenseSubset(exp, g) : g.participants.slice();
    return `
      <div class="field" style="flex-basis:100%;">
        <label>División</label>
        <div class="split-mode">
          <button type="button" class="mode-btn ${!custom?'active':''}" data-splitpick="all">Entre todos, partes iguales</button>
          <button type="button" class="mode-btn ${custom?'active':''}" data-splitpick="custom">Elegir personas / método</button>
        </div>
      </div>
      <div id="custom-split-block" style="${custom?'':'display:none'}; flex-basis:100%;">
        <div class="split-mode" style="margin-bottom:8px;">
          <button type="button" class="mode-btn ${mode==='equal'?'active':''}" data-submode="equal">Partes iguales</button>
          <button type="button" class="mode-btn ${mode==='percent'?'active':''}" data-submode="percent">Porcentajes</button>
          <button type="button" class="mode-btn ${mode==='amount'?'active':''}" data-submode="amount">Montos fijos</button>
        </div>
        <div class="split-picker" id="split-picker">
          ${g.participants.map(p => {
            const isChosen = chosen.includes(p);
            const pct = exp && exp.percents ? exp.percents[p] : "";
            const amt = exp && exp.amounts ? exp.amounts[p] : "";
            return `
            <label>
              <input type="checkbox" data-split-participant="${esc(p)}" ${isChosen?'checked':''}>
              ${esc(p)}
              <input type="number" class="value-input" data-split-value="${esc(p)}"
                style="${mode==='equal'?'display:none':''}"
                placeholder="${mode==='percent'?'%':'$'}" min="0"
                value="${mode==='percent' ? (pct||'') : (amt||'')}">
            </label>`;
          }).join("")}
        </div>
        <p class="split-sum-note" id="split-sum-note"></p>
      </div>
    `;
  }

  function expenseFormHtml(g, exp){
    return `
      <form id="expense-form" class="expense-form" data-expid="${exp?exp.id:''}">
        <div class="form-row">
          <div class="field">
            <label>Descripción</label>
            <input type="text" id="exp-desc" required maxlength="80" value="${exp?esc(exp.description):''}" placeholder="Ej. Torta">
          </div>
          <div class="field">
            <label>Monto (CLP)</label>
            <input type="number" id="exp-amount" required min="1" step="1" value="${exp?exp.amount:''}" placeholder="0">
          </div>
          <div class="field">
            <label>¿Quién pagó?</label>
            <select id="exp-payer" required>
              <option value="" disabled ${!exp?'selected':''}>Elige una persona</option>
              ${g.participants.map(p => `<option value="${esc(p)}" ${exp&&exp.payer===p?'selected':''}>${esc(p)}</option>`).join("")}
            </select>

        <div class="form-row" style="justify-content:flex-end;">

          <button type="submit" class="btn primary">${exp?'Guardar cambios':'Agregar gasto'}</button>
        </div>
      </form>

  function renderGroupScreen(g){
    const editingExpenseId = view.editingExpenseId || null;
    const showingForm = view.showExpenseForm || editingExpenseId;
    const editingExpense = editingExpenseId ? g.expenses.find(e=>e.id===editingExpenseId) : null;

    return `
      ${renderHeader()}
      <div class="back">
        <button class="btn ghost" data-action="back-dashboard">← Todos los grupos</button>
      </div>
      <div class="group-head">
        <div>
          <input class="group-title-edit" id="group-title" value="${esc(g.name)}" maxlength="60">
        </div>
        <div class="group-actions">
          ${g.status==='archived'
            ? `<button class="btn small" data-action="unarchive">Desarchivar</button>`
            : ``}
          <button class="btn small danger" data-action="delete-group">Eliminar grupo</button>
        </div>
      </div>

      <p class="section-title">Participantes</p>
      <div class="chips">
        ${g.participants.map(p => `
          <span class="chip">${esc(p)} <button data-action="remove-participant" data-name="${esc(p)}" title="Quitar">✕</button></span>
        `).join("")}
        <span class="chip add-chip-form">
          <input type="text" id="new-participant" placeholder="Agregar persona" maxlength="30">
          <button class="btn ghost small" data-action="add-participant" style="padding:2px 6px;">+</button>
        </span>
      </div>

      <div class="panel">
        <h2>Gastos</h2>
        ${g.expenses.length ? `
          <div style="overflow-x:auto;">
          <table class="ledger">
            <thead><tr><th>Pagó</th><th>Detalle</th><th style="text-align:right">Monto</th><th></th></tr></thead>
            <tbody>${g.expenses.map(e => ledgerRow(g,e)).join("")}</tbody>
          </table>
          </div>
        ` : `<div class="empty">Sin gastos todavía.</div>`}
        <div style="margin-top:16px;">
          ${showingForm
            ? expenseFormHtml(g, editingExpense)
            : `<button class="btn primary" data-action="show-expense-form" ${g.participants.length<1?'disabled title="Agrega al menos una persona primero"':''}>+ Agregar gasto</button>`
          }
        </div>
      </div>

      ${renderSettlement(g)}
      <footer class="foot">Vaquita · tus datos se sincronizan con tu código (icono 🔗 arriba).</footer>
    `;
  }

  /* ---------- event wiring ---------- */
  function wireEvents(root){
    root.addEventListener("click", onClick);
    root.addEventListener("submit", onSubmit);
    root.addEventListener("keydown", onKeydown);
    root.addEventListener("change", onChange);

    const groupTitle = root.querySelector("#group-title");
    if(groupTitle){
      groupTitle.addEventListener("blur", () => Actions.renameGroup(view.groupId, groupTitle.value));
    }
    wireSplitPicker(root);
  }

  function onKeydown(e){
    if(e.target.id === "new-group-name" && e.key === "Enter"){ createGroupFromInput(); }
    if(e.target.id === "new-participant" && e.key === "Enter"){ addParticipantFromInput(); }
    if(e.target.id === "group-title" && e.key === "Enter"){ e.target.blur(); }
  }

  function createGroupFromInput(){
    const input = document.getElementById("new-group-name");
    if(input) Actions.createGroup(input.value);
  }
  function addParticipantFromInput(){
    const input = document.getElementById("new-participant");
    if(input){ Actions.addParticipant(view.groupId, input.value); }
  }

  function onClick(e){
    const target = e.target.closest("[data-action], [data-splitpick], [data-submode]");
    if(!target) return;

    if(target.dataset.splitpick){ handleSplitPick(target.dataset.splitpick); return; }
    if(target.dataset.submode){ handleSubmode(target.dataset.submode); return; }

    const action = target.dataset.action;
    const btn = target;

    if(action === "open-group"){ view = { screen:"group", groupId: btn.dataset.id }; render(); }
    else if(action === "back-dashboard"){ view = { screen:"dashboard", groupId:null }; render(); }
    else if(action === "create-group"){ createGroupFromInput(); }
    else if(action === "delete-group"){ Actions.deleteGroup(view.groupId); }
    else if(action === "unarchive"){ Actions.unarchiveGroup(view.groupId); }
    else if(action === "add-participant"){ addParticipantFromInput(); }
    else if(action === "remove-participant"){ Actions.removeParticipant(view.groupId, btn.dataset.name); }
    else if(action === "show-expense-form"){ view.showExpenseForm = true; view.editingExpenseId = null; render(); }
    else if(action === "cancel-expense-form"){ view.showExpenseForm = false; view.editingExpenseId = null; render(); }
    else if(action === "edit-expense"){ view.editingExpenseId = btn.dataset.id; view.showExpenseForm = false; render(); }
    else if(action === "delete-expense"){ Actions.deleteExpense(view.groupId, btn.dataset.id); }
    else if(action === "toggle-paid"){ /* handled in onChange */ }
    else if(action === "copy-share"){ copyShareText(); }
    else if(action === "share-image"){ openReceiptImage(findGroup(view.groupId)); }
    else if(action === "show-sync"){ openSyncModal(); }
  }

  function onChange(e){
    if(e.target.dataset.action === "toggle-paid"){
      Actions.toggleTransferPaid(view.groupId, e.target.dataset.key, e.target.checked);
    }
  }

  function copyShareText(){
    const ta = document.getElementById("share-text");
    if(!ta) return;
    ta.hidden = false;
    ta.select();
    try{
      document.execCommand("copy");
      const btn = document.querySelector('[data-action="copy-share"]');
      if(btn){ const orig = btn.textContent; btn.textContent = "¡Copiado!"; setTimeout(()=>btn.textContent=orig, 1500); }
    }catch(err){}
    ta.hidden = true;
  }

  /* ---------- custom modals (native confirm/alert/prompt are unreliable inside the artifact sandbox) ---------- */
  function closeModal(){
    const ov = document.getElementById("vaquita-modal-overlay");
    if(ov) ov.remove();
    document.removeEventListener("keydown", modalEscHandler);
  }
  function modalEscHandler(e){ if(e.key === "Escape") closeModal(); }
  function openModal(innerHtml, opts){
    closeModal();
    const ov = document.createElement("div");
    ov.id = "vaquita-modal-overlay";
    ov.className = "modal-overlay";
    ov.innerHTML = `<div class="modal-box ${opts && opts.wide ? 'wide':''}">${innerHtml}</div>`;
    ov.addEventListener("click", e => { if(e.target === ov) closeModal(); });
    document.body.appendChild(ov);
    document.addEventListener("keydown", modalEscHandler);
    return ov;
  }
  function showAlert(message){
    const ov = openModal(`
      <p class="modal-message">${esc(message)}</p>
      <div class="modal-actions"><button class="btn primary" id="modal-ok">Entendido</button></div>
    `);
    ov.querySelector("#modal-ok").addEventListener("click", closeModal);
  }
  function showConfirm(message, onYes){
    const ov = openModal(`
      <p class="modal-message">${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">Cancelar</button>
        <button class="btn danger-solid" id="modal-yes">Eliminar</button>
      </div>
    `);
    ov.querySelector("#modal-cancel").addEventListener("click", closeModal);
    ov.querySelector("#modal-yes").addEventListener("click", () => { closeModal(); onYes(); });
  }

  /* ---------- shareable image (canvas render, no external libs) ---------- */
  function truncateText(ctx, text, maxWidth){
    if(ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while(t.length > 1 && ctx.measureText(t + "…").width > maxWidth){ t = t.slice(0, -1); }
    return t + "…";
  }

  function buildReceiptCanvas(g){
    const { balance, transfers } = computeSettlement(g);
    const hasExpenses = g.expenses.length > 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = 680;
    const pad = 36;
    const rowH = 30;
    const smallRowH = 25;

    const css = getComputedStyle(document.documentElement);
    const tok = (name, fb) => (css.getPropertyValue(name).trim() || fb);
    const paperC = tok('--surface', '#FCFCF7');
    const inkC = tok('--ink', '#1C2420');
    const inkSoftC = tok('--ink-soft', '#5B6459');
    const brandC = tok('--brand', '#2E6B45');
    const owesC = tok('--owes', '#B14F2B');
    const owedC = tok('--owed', '#245E82');
    const borderC = tok('--border', '#DAE2D2');

    let H = pad + 40 + 26 + 24 + 22;
    H += hasExpenses ? g.expenses.length * rowH + 8 : 30;
    H += 30 + 22;
    H += transfers.length ? transfers.length * 34 : 34;
    H += 24 + 22 + 26;
    H += g.participants.length * smallRowH;
    H += 30 + 24 + pad;

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    ctx.fillStyle = paperC;
    ctx.fillRect(0, 0, W, H);

    let y = pad;
    ctx.textAlign = "left";
    ctx.fillStyle = inkC;
    ctx.font = "700 24px Georgia, 'Times New Roman', serif";
    ctx.fillText("🐮 " + g.name, pad, y + 20);
    y += 40;

    ctx.font = "400 13px Arial, sans-serif";
    ctx.fillStyle = inkSoftC;
    const dateStr = new Date().toLocaleDateString('es-CL', { day:'numeric', month:'long', year:'numeric' });
    ctx.fillText(truncateText(ctx, `Cuadre generado el ${dateStr} · ${g.participants.join(", ")}`, W - pad*2), pad, y);
    y += 26;

    ctx.strokeStyle = borderC;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
    y += 24;

    ctx.font = "700 12px Arial, sans-serif";
    ctx.fillStyle = brandC;
    ctx.fillText("GASTOS", pad, y);
    y += 22;

    if(hasExpenses){
      const amountX = W - pad;
      const descX = pad + 96;
      g.expenses.forEach(exp => {
        ctx.font = "600 14px Arial, sans-serif";
        ctx.fillStyle = inkC;
        ctx.textAlign = "left";
        ctx.fillText(truncateText(ctx, exp.payer, 86), pad, y + 14);
        ctx.font = "400 14px Arial, sans-serif";
        ctx.fillText(truncateText(ctx, exp.description, amountX - descX - 110), descX, y + 14);
        ctx.font = "600 14px 'Courier New', monospace";
        ctx.textAlign = "right";
        ctx.fillText(fmt(exp.amount), amountX, y + 14);
        ctx.textAlign = "left";
        y += rowH;
      });
    } else {
      ctx.font = "400 13px Arial, sans-serif";
      ctx.fillStyle = inkSoftC;
      ctx.fillText("Sin gastos registrados.", pad, y + 10);
      y += 30;
    }

    y += 22;
    ctx.font = "700 12px Arial, sans-serif";
    ctx.fillStyle = brandC;
    ctx.fillText("CUADRE FINAL", pad, y);
    y += 22;

    if(transfers.length){
      transfers.forEach(t => {
        ctx.font = "600 15px Arial, sans-serif";
        ctx.fillStyle = inkC;
        ctx.textAlign = "left";
        ctx.fillText(truncateText(ctx, `${t.from}  →  ${t.to}`, W - pad*2 - 140), pad, y + 15);
        ctx.font = "700 15px 'Courier New', monospace";
        ctx.fillStyle = t.paid ? brandC : owesC;
        ctx.textAlign = "right";
        ctx.fillText(fmt(t.amount) + (t.paid ? "  ✓" : ""), W - pad, y + 15);
        ctx.textAlign = "left";
        y += 34;
      });
    } else {
      ctx.font = "600 15px Arial, sans-serif";
      ctx.fillStyle = brandC;
      ctx.fillText("✓ Las cuentas están parejas.", pad, y + 12);
      y += 34;
    }

    y += 24;
    ctx.font = "700 11px Arial, sans-serif";
    ctx.fillStyle = inkSoftC;
    ctx.fillText("DETALLE POR PERSONA", pad, y);
    y += 8;
    ctx.strokeStyle = borderC;
    ctx.beginPath(); ctx.moveTo(pad, y + 8); ctx.lineTo(W - pad, y + 8); ctx.stroke();
    y += 26;

    const colPagoX = W - pad - 130;
    const colBalX = W - pad;
    g.participants.forEach(p => {
      const paidTotal = g.expenses.filter(e => e.payer === p).reduce((s,e) => s + e.amount, 0);
      const bal = balance[p] || 0;
      ctx.font = "400 13px Arial, sans-serif";
      ctx.fillStyle = inkC;
      ctx.textAlign = "left";
      ctx.fillText(truncateText(ctx, p, 220), pad, y);
      ctx.font = "600 13px 'Courier New', monospace";
      ctx.textAlign = "right";
      ctx.fillText(fmt(paidTotal), colPagoX, y);
      ctx.fillStyle = bal > 0.5 ? owedC : (bal < -0.5 ? owesC : inkSoftC);
      ctx.fillText((bal > 0.5 ? "+" : "") + fmt(bal), colBalX, y);
      ctx.textAlign = "left";
      y += smallRowH;
    });

    y += 20;
    ctx.font = "400 11px Arial, sans-serif";
    ctx.fillStyle = inkSoftC;
    ctx.textAlign = "center";
    ctx.fillText("Generado con Vaquita 🐮", W / 2, y);
    ctx.textAlign = "left";

    return canvas;
  }

  function openReceiptImage(g){
    if(!g) return;
    const canvas = buildReceiptCanvas(g);
    const dataUrl = canvas.toDataURL("image/png");
    const ov = openModal(`
      <h3>Imagen para compartir</h3>
      <p class="modal-message">Mantén presionada la imagen (o clic derecho → Guardar imagen como) para guardarla, o cópiala directo al portapapeles.</p>
      <div class="receipt-image-frame">
        <img src="${dataUrl}" alt="Cuadre de ${esc(g.name)}">
      </div>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="btn ghost" id="modal-close-img">Cerrar</button>
        <button class="btn primary" id="modal-copy-img">Copiar imagen</button>
      </div>
    `, { wide: true });
    ov.querySelector("#modal-close-img").addEventListener("click", closeModal);
    ov.querySelector("#modal-copy-img").addEventListener("click", async () => {
      const btn = ov.querySelector("#modal-copy-img");
      const orig = btn.textContent;
      try{
        const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
        if(!blob || !window.ClipboardItem) throw new Error("no clipboard image support");
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        btn.textContent = "¡Copiada!";
      }catch(err){
        btn.textContent = "No se pudo copiar, guárdala manualmente";
      }
      setTimeout(() => { btn.textContent = orig; }, 2000);
    });
  }

  let pendingSplitPick = "all";
  let pendingSubmode = "equal";

  function handleSplitPick(which){
    pendingSplitPick = which;
    const block = document.getElementById("custom-split-block");
    if(block) block.style.display = which === "custom" ? "" : "none";
    document.querySelectorAll('[data-splitpick]').forEach(b => b.classList.toggle("active", b.dataset.splitpick===which));
    updateSplitSumNote();
  }
  function handleSubmode(mode){
    pendingSubmode = mode;
    document.querySelectorAll('[data-submode]').forEach(b => b.classList.toggle("active", b.dataset.submode===mode));
    document.querySelectorAll('.value-input').forEach(inp => {
      inp.style.display = mode === "equal" ? "none" : "";
      inp.placeholder = mode === "percent" ? "%" : "$";
    });
    updateSplitSumNote();
  }
  function wireSplitPicker(root){
    const form = root.querySelector("#expense-form");
    if(!form) return;
    pendingSplitPick = form.dataset.expid ? (document.querySelector('[data-splitpick].active')?.dataset.splitpick || "all") : "all";
    pendingSubmode = document.querySelector('[data-submode].active')?.dataset.submode || "equal";
    form.querySelectorAll('[data-split-participant], [data-split-value], #exp-amount').forEach(el => {
      el.addEventListener("input", updateSplitSumNote);
    });
    updateSplitSumNote();
  }
  function updateSplitSumNote(){
    const note = document.getElementById("split-sum-note");
    if(!note) return;
    if(pendingSplitPick === "all" || pendingSubmode === "equal"){ note.textContent = ""; return; }
    const amountInput = document.getElementById("exp-amount");
    const total = amountInput ? Number(amountInput.value)||0 : 0;
    let sum = 0;
    document.querySelectorAll('#split-picker [data-split-value]').forEach(inp => {
      const cb = document.querySelector(`[data-split-participant="${CSS.escape(inp.dataset.splitValue)}"]`);
      if(cb && cb.checked) sum += Number(inp.value)||0;
    });
    if(pendingSubmode === "percent"){
      note.textContent = `Suma actual: ${sum}%` + (sum!==100 ? " (se ajustará automáticamente al 100%)" : "");
      note.className = "split-sum-note " + (sum===100?"good":"");
    } else {
      note.textContent = `Suma actual: ${fmt(sum)} de ${fmt(total)}`;
      note.className = "split-sum-note " + (sum===total && total>0 ? "good":"bad");
    }
  }

  function onSubmit(e){
    if(e.target.id !== "expense-form") return;
    e.preventDefault();
    const form = e.target;
    const desc = form.querySelector("#exp-desc").value.trim();
    const amount = Math.round(Number(form.querySelector("#exp-amount").value));
    const payer = form.querySelector("#exp-payer").value;
    if(!desc || !amount || !payer) return;

    const g = findGroup(view.groupId);
    let splitMode = "equal";
    let fixedParticipants = null;
    let percents = null, amounts = null;

    if(pendingSplitPick === "custom"){
      const chosen = Array.from(form.querySelectorAll('#split-picker [data-split-participant]'))
        .filter(cb => cb.checked).map(cb => cb.dataset.splitParticipant);
      if(chosen.length === 0){ showAlert("Elige al menos una persona para dividir el gasto."); return; }
      fixedParticipants = chosen;
      splitMode = pendingSubmode;
      if(pendingSubmode === "percent"){
        percents = {};
        chosen.forEach(p => {
          const inp = form.querySelector(`[data-split-value="${CSS.escape(p)}"]`);
          percents[p] = inp ? Number(inp.value)||0 : 0;
        });
      } else if(pendingSubmode === "amount"){
        amounts = {};
        chosen.forEach(p => {
          const inp = form.querySelector(`[data-split-value="${CSS.escape(p)}"]`);
          amounts[p] = inp ? Number(inp.value)||0 : 0;
        });
      }
    }

    const payload = { description: desc, amount, payer, splitMode, fixedParticipants, percents, amounts };
    const expId = form.dataset.expid;
    view.showExpenseForm = false;
    view.editingExpenseId = null;
    if(expId){
      Actions.updateExpense(view.groupId, expId, payload);
    } else {
      Actions.addExpense(view.groupId, payload);
    }
  }

  async function init(){
    document.getElementById("app").innerHTML = '<p style="padding:60px 0; text-align:center; color:var(--ink-soft);">Cargando tu Vaquita…</p>';
    state = await Store.load(syncCode);
    lastSyncedJson = JSON.stringify(state);
    render();
    subscribeSync(syncCode);
  }
  init();
})();
</script>
